name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install and smoke-test the local CLI entry point
        run: |
          pip install -e backend
          aegispr --help
          aegispr compare-gpu --help
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Test read-only demo recorder guards
        run: npm run demo:test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  gpu-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt numpy==2.3.2
      - run: PYTHONPATH=. pytest -q tests
        working-directory: gpu-worker

  cli-docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - name: Verify real isolated base/head test execution without inference
        run: python scripts/cli-docker-acceptance.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit resolved Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r backend/requirements.txt pip-audit
          pip-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Reject committed secrets
        run: |
          ! git grep -nE '(NEBIUS_API_KEY|GITHUB_TOKEN|GPU_WORKER_TOKEN|API_ACCESS_TOKEN)=[^[:space:]]+' -- ':!*.example'

  judge-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run keyless full-stack controlled acceptance
        run: bash scripts/judge-test-build.sh start
      - name: Export fixed-fixture execution receipts
        if: success()
        run: bash scripts/judge-test-build.sh export
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Inspect real controlled reports in Chromium without API mocks
        run: npm run e2e:judge
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: controlled-fixture-evidence
          path: artifacts/judge/evidence/*.json
          if-no-files-found: error
      - name: Stop only the isolated judge services
        if: always()
        run: bash scripts/judge-test-build.sh stop
